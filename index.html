<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Think Board</title>
    <script>
      // Apply the saved theme before React loads, so the page does not flash the wrong colors.
      try {
        const theme = localStorage.getItem('think-board-theme')
        if (theme) document.documentElement.setAttribute('data-theme', theme)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
